name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.repository_owner == 'simpsonm09-org'
    uses: ./.github/workflows/lint.yml # zizmor: ignore[self-repository] actionlint rejects the $/ form
  aislop:
    if: github.repository_owner == 'simpsonm09-org'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/aislop.yml # zizmor: ignore[self-repository] actionlint rejects the $/ form
  security:
    if: github.repository_owner == 'simpsonm09-org'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yml # zizmor: ignore[self-repository] actionlint rejects the $/ form
  standard:
    if: github.repository_owner == 'simpsonm09-org'
    permissions:
      contents: read
    uses: ./.github/workflows/standard.yml # zizmor: ignore[self-repository] actionlint rejects the $/ form
  coverage:
    if: github.repository_owner == 'simpsonm09-org'
    permissions:
      contents: read
    uses: ./.github/workflows/coverage.yml # zizmor: ignore[self-repository] actionlint rejects the $/ form

  test:
    if: github.repository_owner == 'simpsonm09-org'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - name: Check the manifest, recipes, and generated artifacts
        run: just check
      - name: Run the suite
        run: just test
      - name: Check the agent access resolver
        run: node scripts/agent-access.mjs --self-test
      - name: Check the agent app manifest
        run: node scripts/create-agent-app.mjs --self-test
      - name: Check the agent token broker
        run: node scripts/agent-token.mjs --self-test
      - name: Check the ruleset payload builder
        run: node scripts/ruleset-payload.mjs --self-test

  test-windows:
    if: github.repository_owner == 'simpsonm09-org'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - name: Focused portability regression
        run: just test-portable

  test-macos:
    if: github.repository_owner == 'simpsonm09-org'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - name: Focused portability regression
        run: just test-portable

  all-checks:
    if: always()
    needs: [lint, aislop, security, standard, coverage, test, test-windows, test-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS" | jq -e 'all(.[]; .result == "success")'
